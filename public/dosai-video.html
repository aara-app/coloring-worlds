<!DOCTYPE html>

<head>

<title>Dosai Amma Dosai</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  <h1>Dosai Amma Dosai</h1>

  <div class="hint">
    <b>To save to Photos:</b><br>
